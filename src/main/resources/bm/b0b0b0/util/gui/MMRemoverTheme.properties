#---- palette ----

@background = #16171a
@foreground = #e3e5e8
@componentBackground = #1e2024
@buttonBackground = #2a2d32
@menuBackground = #1e2024
@accentColor = #10b866
@selectionBackground = #10b866
@selectionForeground = #ffffff
@selectionInactiveBackground = #2c3036
@disabledForeground = #6b7079

#---- app colors ----

MMRemover.cardBackground = #1e2024
MMRemover.cardBorderColor = #2a2d33
MMRemover.hoverBackground = #272a2f
MMRemover.selectedBackground = #163a29
MMRemover.mutedForeground = #8a909a
MMRemover.accentColor = #10b866
MMRemover.dangerColor = #f0646e
MMRemover.consoleBackground = #121316
MMRemover.consoleForeground = #c7ccd3
MMRemover.iconColor = #aeb4bd
MMRemover.jarIconColor = #4fc98a

#---- shape ----

Component.arc = 10
Button.arc = 10
TextComponent.arc = 8
Component.focusWidth = 0
Component.innerFocusWidth = 1
Button.innerFocusWidth = 0
Component.borderColor = #2f3238
Button.borderColor = #33363c
Button.hoverBorderColor = #3d4148
Button.hoverBackground = #33363c
Button.pressedBackground = #3a3e44
Button.default.borderWidth = 0
Button.default.hoverBackground = #14c973
Button.default.pressedBackground = #0ea65c
Button.toolbar.hoverBackground = #2c2f35
Button.toolbar.pressedBackground = #34383e
Button.toolbar.margin = 4,4,4,4
Button.toolbar.spacingInsets = 0,0,0,0

#---- window ----

TitlePane.unifiedBackground = true
TitlePane.background = @background
TitlePane.inactiveBackground = @background
TitlePane.embeddedForeground = #8a909a
TitlePane.centerTitle = false

#---- split pane ----

SplitPane.background = @background
SplitPane.dividerSize = 12
SplitPaneDivider.style = plain
SplitPaneDivider.draggingColor = #10b86633

#---- scroll ----

ScrollPane.border = null
ScrollPane.background = $MMRemover.cardBackground
ScrollBar.width = 9
ScrollBar.track = #00000000
ScrollBar.thumb = #3a3e45
ScrollBar.hoverThumbColor = #4a4f57
ScrollBar.pressedThumbColor = #565b64
ScrollBar.hoverTrackColor = #00000000
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.thumbArc = 999

#---- lists / popups ----

List.background = $MMRemover.cardBackground
Popup.borderCornerRadius = 10
PopupMenu.borderInsets = 6,6,6,6
PopupMenu.borderColor = #2f3238
MenuItem.selectionArc = 8
MenuItem.selectionInsets = 0,0,0,0
MenuItem.selectionBackground = #2c3036
MenuItem.margin = 5,10,5,10

#---- tooltip ----

ToolTip.background = #2c2f35
ToolTip.foreground = #eef0f3
ToolTip.border = 6,10,6,10
ToolTip.borderCornerRadius = 8

#---- option pane ----

OptionPane.background = @background
Panel.background = @background
